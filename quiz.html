<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنك الأسئلة | NURSING DOSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Calm reading page in the summaries site's palette. Content sits on the page, not in boxes; one radius; no shadows. */
:root{
  --paper:#f3f6f5; --sheet:#ffffff; --ink:#132b27; --soft:#2e4541; --muted:#5b6f6b; --line:#d7e1de;
  --accent:#17705f; --accent-ink:#ffffff; --tint:#e3efeb; --mark:#f0c45a;
  --ok:#17705f; --ok-bg:#e3efeb; --no:#b0493d; --no-bg:#f8e9e6;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1817; --sheet:#16211f; --ink:#e3ece9; --soft:#c9d6d2; --muted:#9db0ab; --line:#28403b;
  --accent:#4fbfa6; --accent-ink:#06201b; --tint:#1b2e2a; --mark:#e2b74f;
  --ok:#5fcfb4; --ok-bg:#173029; --no:#ec8f80; --no-bg:#35201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1817; --sheet:#16211f; --ink:#e3ece9; --soft:#c9d6d2; --muted:#9db0ab; --line:#28403b;
  --accent:#4fbfa6; --accent-ink:#06201b; --tint:#1b2e2a; --mark:#e2b74f;
  --ok:#5fcfb4; --ok-bg:#173029; --no:#ec8f80; --no-bg:#35201c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 80px}

/* top line */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;font-size:.92rem}
.top a,.top button{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer}
.top .where{color:var(--muted)}

h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,5vw,2rem);line-height:1.25;margin:0}
.lead{color:var(--muted);margin:6px 0 0}

/* lecture list: rows on the page with hairlines */
.list{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;padding:15px 4px;cursor:pointer}
.row:hover:not(:disabled){background:var(--tint)}
.row:disabled{opacity:.5;cursor:default}
.row .n{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.row .en{display:block;font-family:var(--en);font-weight:500;direction:ltr;text-align:right;line-height:1.4}
.row .ar{display:block;font-size:.86rem;color:var(--muted);line-height:1.5;margin-top:2px}
.row .side{text-align:left;font-size:.84rem;color:var(--muted);white-space:nowrap;line-height:1.5}
.row .best{display:block;color:var(--accent);font-weight:600}
.final{margin-top:30px;background:var(--tint);border-radius:var(--r)}
.final .row{padding:18px 12px}
.final .row:hover{background:transparent}
.final .n{font-size:1.3rem}
.final .en{font-weight:600}

/* intro */
.intro h1{font-family:var(--en);font-weight:600;direction:ltr;text-align:right;font-size:1.45rem}
.field{margin-top:24px}
.field h2{font-family:var(--display);font-size:.98rem;font-weight:600;margin:0 0 10px;color:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg .c{opacity:.75;font-size:.85rem;margin-inline-start:4px}
.btn{display:block;width:100%;border:0;border-radius:var(--r);padding:15px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:1.02rem;cursor:pointer;margin-top:28px}
.btn:disabled{opacity:.4;cursor:default}
.btn.line{background:none;color:var(--accent);border:1px solid var(--line);margin-top:10px}

/* progress line under the top bar */
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:-12px 0 24px}
.prog span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* question */
.from{font-size:.86rem;color:var(--muted);margin:0 0 10px}
.from .hot{color:var(--ink);font-weight:600}
.from .hot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mark);margin-inline-end:6px;vertical-align:middle}
.q{font-family:var(--en);direction:ltr;text-align:left;font-size:1.14rem;line-height:1.65;margin:0 0 20px;font-weight:500}
.q .id{color:var(--muted);font-weight:400;margin-right:8px;font-size:.92em}
.fig{display:block;max-width:100%;max-height:300px;margin:0 auto 20px;border-radius:var(--r);background:#fff}
.tip{font-size:.9rem;color:var(--muted);margin:-8px 0 14px}

.opts{display:grid;gap:10px;direction:ltr}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;font-family:var(--en);font-size:1rem;line-height:1.5;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:1.4rem;color:var(--muted);font-weight:600}
.opt .t{flex:1;min-width:0}
.opt .ic{flex:none;width:20px;height:20px;margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{color:var(--no)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}

/* fill-in questions */
.blank{border:1px dashed var(--line);border-radius:var(--r);padding:14px;font-family:var(--en);direction:ltr;text-align:left;color:var(--muted);min-height:52px}
.blank.shown{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--tint);font-weight:500}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pair button{border-radius:var(--r);padding:13px;font-family:var(--display);font-weight:600;cursor:pointer;background:var(--sheet);border:1px solid var(--line)}
.pair .y{color:var(--ok)}
.pair .n{color:var(--no)}

/* explanation */
.why{margin-top:22px;padding:2px 16px 2px 0;border-right:3px solid var(--ok)}
.why.no{border-right-color:var(--no)}
.why .v{font-family:var(--display);font-weight:600;color:var(--ok);margin:0 0 4px}
.why.no .v{color:var(--no)}
.why .ans{margin:0 0 8px;font-size:.95rem}
.why .ans span{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-weight:600}
.why p.x{margin:0;font-size:1.02rem;line-height:1.95;color:var(--soft)}

/* result */
.res{text-align:center;padding-top:8px}
.big{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;margin:6px 0 0}
.big small{font-size:1.4rem;color:var(--muted);font-weight:600}
.pct{color:var(--muted);margin:2px 0 14px}
.msg{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:18px auto 4px;max-width:420px;direction:rtl}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--ok)}
.dots i.x{background:var(--no)}
.legend{font-size:.82rem;color:var(--muted);margin:0}
.review{text-align:start;margin-top:30px}
.review h2{font-family:var(--display);font-size:1.05rem;font-weight:600;margin:0 0 6px}
.review details{border-bottom:1px solid var(--line);padding:12px 0}
.review summary{cursor:pointer;font-family:var(--en);direction:ltr;text-align:left;line-height:1.55}
.review .body{margin-top:10px;font-size:.95rem}
.review .en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-weight:600}
.review .mine{color:var(--no)}
.review .good{color:var(--ok)}
.review p{margin:8px 0 0;color:var(--soft);line-height:1.9}
.loading{text-align:center;padding-top:80px;color:var(--muted)}

@media (max-width:480px){
  .wrap{padding:16px 14px 72px}
  .q{font-size:1.08rem}
  .big{font-size:2.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap" id="app"><p class="loading">بيحمّل الأسئلة…</p></div>
<script>
let DATA = window.QUIZ_DATA || null;
const IMGS = {};
const CDN="https://cdn.jsdelivr.net/gh/NURSINGDOSE/nursing-summaries@main/";
const ar = n => Number(n).toLocaleString("ar-EG");
const $app = document.getElementById("app");
const K = k => (DATA.slug||"x")+"-"+k;
const store = { get(k){ try{ return JSON.parse(localStorage.getItem("nd-q-"+K(k))); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem("nd-q-"+K(k), JSON.stringify(v)); }catch(e){} } };
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); } for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); } return e; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const optText = (q,k) => (q.opts.find(o=>o[0]===k)||[k,""])[1];
const ansText = q => q.complete ? q.ans_text : q.ans.map(k=>k+") "+optText(q,k)).join("   ");
const icon = ok => { const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 20 20"); s.setAttribute("class","ic"); s.setAttribute("aria-hidden","true");
  s.innerHTML= ok ? '<path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' : '<path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>';
  s.style.color= ok ? "var(--ok)" : "var(--no)"; return s; };
const topBar = (left,right) => el("div",{class:"top"},right,left);
let state=null;

/* ---------- home ---------- */
function home(){
  state=null; document.onkeydown=null; $app.textContent="";
  $app.append(topBar(el("a",{href:"./"},"الملخصات"),el("span",{class:"where"},"بنك الأسئلة")));
  $app.append(el("h1",{},DATA.name),el("p",{class:"lead"},`${ar(DATA.qs.length)} سؤال من امتحانات الدفعات اللي فاتت، كل سؤال معاه شرح. اختار محاضرة تبدأ بيها.`));
  const list=el("ul",{class:"list"});
  DATA.lecs.forEach(L=>{
    const n=DATA.qs.filter(q=>q.lec===L.n).length, best=store.get("lec"+L.n);
    list.append(el("li",{},el("button",{class:"row",type:"button",disabled:L.ready===false||!n,onclick:()=>intro({key:"lec"+L.n,title:L.en,sub:L.ar,pool:DATA.qs.filter(q=>q.lec===L.n),final:false})},
      el("span",{class:"n"},ar(L.n)),
      el("span",{},el("span",{class:"en"},L.en),el("span",{class:"ar"},L.ar)),
      el("span",{class:"side"},`${ar(n)} سؤال`,best!=null?el("span",{class:"best"},`أعلى درجة ${ar(best)}٪`):null))));
  });
  const fbest=store.get("final");
  $app.append(list,el("div",{class:"final"},el("button",{class:"row",type:"button",onclick:()=>intro({key:"final",title:"Final Exam",sub:"امتحان شامل من كل المحاضرات",pool:DATA.qs,final:true})},
    el("span",{class:"n"},"✦"),
    el("span",{},el("span",{class:"en"},"Final Exam"),el("span",{class:"ar"},"امتحان شامل، أسئلة متلخبطة من كل المحاضرات")),
    el("span",{class:"side"},`${ar(DATA.qs.length)} سؤال`,fbest!=null?el("span",{class:"best"},`أعلى درجة ${ar(fbest)}٪`):null))));
  window.scrollTo({top:0});
}

/* ---------- intro ---------- */
function intro(cfg){
  $app.textContent=""; document.onkeydown=null;
  const past=cfg.pool.filter(q=>q.kind==="past"), ncl=cfg.pool.filter(q=>q.kind==="nclex");
  let filter="all", order=cfg.final?"shuffle":"order", size=cfg.final?Math.min(30,cfg.pool.length):0;
  $app.append(topBar(el("span",{class:"where"},DATA.name),el("button",{type:"button",onclick:home},"رجوع للمحاضرات")));
  const box=el("div",{class:"intro"});
  box.append(el("h1",{},cfg.title),el("p",{class:"lead"},`${cfg.sub}. فيها ${ar(past.length)} سؤال من الامتحانات و${ar(ncl.length)} على طريقة NCLEX.`));
  const opt=(label,on,fn,count)=>el("button",{type:"button","aria-pressed":String(on),onclick:fn},label,count!=null?el("span",{class:"c"},ar(count)):null);
  const g1=el("div",{class:"seg"}),g2=el("div",{class:"seg"}),g3=el("div",{class:"seg"});
  const start=el("button",{class:"btn",type:"button"});
  const pick=()=>filter==="past"?past:filter==="nclex"?ncl:cfg.pool;
  function draw(){
    g1.textContent="";g2.textContent="";g3.textContent="";
    g1.append(opt("كل الأسئلة",filter==="all",()=>{filter="all";draw();},cfg.pool.length),opt("امتحانات سابقة",filter==="past",()=>{filter="past";draw();},past.length),opt("NCLEX",filter==="nclex",()=>{filter="nclex";draw();},ncl.length));
    g2.append(opt("بالترتيب",order==="order",()=>{order="order";draw();}),opt("عشوائي",order==="shuffle",()=>{order="shuffle";draw();}));
    const n=pick().length;
    [10,20,30].filter(x=>x<n).forEach(x=>g3.append(opt(`${ar(x)} سؤال`,size===x,()=>{size=x;draw();})));
    g3.append(opt("الكل",!size||size>=n,()=>{size=0;draw();},n));
    const total=(!size||size>=n)?n:size;
    start.textContent=`ابدأ (${ar(total)} سؤال)`; start.disabled=!n;
  }
  start.onclick=()=>{ let qs=pick(); if(order==="shuffle") qs=shuffle(qs); if(size&&size<qs.length) qs=qs.slice(0,size); begin(cfg,qs); };
  box.append(el("div",{class:"field"},el("h2",{},"نوع الأسئلة"),g1),el("div",{class:"field"},el("h2",{},"الترتيب"),g2),el("div",{class:"field"},el("h2",{},"عدد الأسئلة"),g3),start);
  $app.append(box); draw(); window.scrollTo({top:0});
}

/* ---------- quiz ---------- */
function begin(cfg,qs){ state={cfg,qs,i:0,right:0,answers:[]}; renderQ(); }
function renderQ(){
  const {cfg,qs,i}=state, q=qs[i]; $app.textContent="";
  $app.append(topBar(el("span",{class:"where"},`${ar(i+1)} من ${ar(qs.length)}`),el("button",{type:"button",onclick:()=>intro(cfg)},"خروج")));
  const pr=el("div",{class:"prog"}); const fill=el("span"); fill.style.width=(i/qs.length*100)+"%"; pr.append(fill); $app.append(pr);
  const from=el("p",{class:"from"});
  const bits=[]; if(cfg.final) bits.push(`محاضرة ${ar(q.lec)}`); bits.push(...q.srcs);
  from.append(bits.join("، "));
  if(q.sug) from.append("، إجابة مقترحة");
  if(q.hot){ from.append(el("br")); from.append(el("span",{class:"hot"},"سؤال متكرر في الامتحانات")); }
  $app.append(from, el("p",{class:"q"},el("span",{class:"id"},q.id),q.q));
  if(q.img){ const im=el("img",{class:"fig",src:IMGS[q.img]||(CDN+q.img),alt:"الصورة اللي في السؤال"}); im.onerror=()=>{ im.onerror=null; im.src=q.img; }; $app.append(im); }
  const why=el("div"); const next=el("button",{class:"btn",type:"button",hidden:true},i+1<qs.length?"السؤال اللي بعده":"شوف النتيجة");
  next.onclick=()=>{ state.i++; if(state.i<qs.length) renderQ(); else result(); };
  let done=false;
  const explain=(ok,extra)=>el("div",{class:"why"+(ok?"":" no"),role:"status"},el("p",{class:"v"},ok?"إجابة صح":"إجابة غلط"),extra,el("p",{class:"x"},q.ex));

  if(q.complete){
    $app.append(el("p",{class:"tip"},"فكّر في الإجابة الأول، وبعدين اكشفها وقول عرفتها ولا لأ."));
    const blank=el("div",{class:"blank"},"……");
    const reveal=el("button",{class:"btn line",type:"button"},"اكشف الإجابة");
    const pair=el("div",{class:"pair",hidden:true});
    reveal.onclick=()=>{ reveal.hidden=true; blank.textContent=q.ans_text; blank.classList.add("shown"); pair.hidden=false; };
    const mark=ok=>{ if(done) return; done=true; pair.remove(); if(ok) state.right++; state.answers.push({q,picked:[],ok}); why.append(explain(ok,null)); next.hidden=false; next.focus({preventScroll:true}); why.scrollIntoView({behavior:"smooth",block:"nearest"}); };
    pair.append(el("button",{class:"y",type:"button",onclick:()=>mark(true)},"عرفتها"),el("button",{class:"n",type:"button",onclick:()=>mark(false)},"معرفتهاش"));
    $app.append(blank,reveal,pair,why,next); window.scrollTo({top:0});
    document.onkeydown=e=>{ if(e.key==="Enter"&&done) next.click(); };
    return;
  }

  if(q.multi) $app.append(el("p",{class:"tip"},"اختار كل الإجابات الصح، وبعدين دوس «تأكيد»."));
  const opts=el("div",{class:"opts",role:q.multi?"group":"radiogroup"}); const chosen=new Set();
  const confirm=el("button",{class:"btn",type:"button",hidden:!q.multi,disabled:true},"تأكيد");
  const btns=q.opts.map(([k,t])=>{
    const b=el("button",{class:"opt",type:"button","data-k":k},el("span",{class:"k"},k),el("span",{class:"t"},t));
    b.onclick=()=>{ if(done) return; if(q.multi){ chosen.has(k)?chosen.delete(k):chosen.add(k); b.classList.toggle("sel",chosen.has(k)); confirm.disabled=!chosen.size; } else { chosen.clear(); chosen.add(k); finish(); } };
    opts.append(b); return b; });
  function finish(){
    done=true; const correct=new Set(q.ans); const ok=chosen.size===correct.size&&[...chosen].every(k=>correct.has(k));
    btns.forEach(b=>{ const k=b.dataset.k; b.disabled=true; b.classList.remove("sel");
      if(correct.has(k)){ b.classList.add("right"); b.append(icon(true)); }
      else if(chosen.has(k)){ b.classList.add("wrong"); b.append(icon(false)); }
      else b.classList.add("dim"); });
    if(ok) state.right++;
    state.answers.push({q,picked:[...chosen],ok});
    why.append(explain(ok, ok?null:el("p",{class:"ans"},"الصح: ",el("span",{},ansText(q)))));
    confirm.hidden=true; next.hidden=false; next.focus({preventScroll:true});
    why.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  confirm.onclick=finish;
  $app.append(opts,confirm,why,next); window.scrollTo({top:0});
  document.onkeydown=e=>{ if(!state||state.qs[state.i]!==q) return; const k=e.key.toLowerCase(); let idx="abcdefgh".indexOf(k); if(idx<0) idx="12345678".indexOf(k); if(!done&&idx>-1&&btns[idx]) btns[idx].click(); else if(e.key==="Enter"&&done) next.click(); };
}

/* ---------- result ---------- */
function result(){
  const {cfg,qs,right,answers}=state; const pct=Math.round(right/qs.length*100); $app.textContent=""; document.onkeydown=null;
  const prev=store.get(cfg.key); if(prev==null||pct>prev) store.set(cfg.key,pct);
  const msg= pct>=90?"ممتاز، إنت جاهز للامتحان": pct>=75?"كويس جداً، راجع الغلطات بس": pct>=50?"محتاج تراجع المحاضرة تاني":"راجع الملخص الأول وبعدين جرّب تاني";
  $app.append(topBar(el("span",{class:"where"},cfg.sub),el("button",{type:"button",onclick:home},"رجوع للمحاضرات")));
  const res=el("div",{class:"res"});
  const dots=el("div",{class:"dots","aria-hidden":"true"}); answers.forEach(a=>dots.append(el("i",{class:a.ok?"":"x"})));
  res.append(el("p",{class:"big"},ar(right),el("small",{}," / "+ar(qs.length))),el("p",{class:"pct"},`${ar(pct)}٪`+(prev!=null?(pct>prev?`، أحسن من المرة اللي فاتت (${ar(prev)}٪)`:`، أعلى درجة ليك ${ar(Math.max(prev,pct))}٪`):"")),
    el("p",{class:"msg"},msg),dots,el("p",{class:"legend"},"كل مربع سؤال بالترتيب: الأخضر صح والأحمر غلط"));
  const wrong=answers.filter(a=>!a.ok);
  if(wrong.length) res.append(el("button",{class:"btn",type:"button",onclick:()=>begin(cfg,wrong.map(a=>a.q))},`عيد الـ ${ar(wrong.length)} اللي غلطت فيهم`));
  res.append(el("button",{class:"btn line",type:"button",onclick:()=>begin(cfg,cfg.final?shuffle(qs):qs)},"عيد الكويز كله"));
  $app.append(res);
  if(wrong.length){
    const rv=el("div",{class:"review"},el("h2",{},"راجع اللي غلطت فيه"));
    wrong.forEach(a=>rv.append(el("details",{},el("summary",{},`${a.q.id}  ${a.q.q}`),
      el("div",{class:"body"},
        a.q.complete?null:el("div",{},"إجابتك: ",el("span",{class:"en mine"},a.picked.map(k=>k+") "+optText(a.q,k)).join("   "))),
        el("div",{},"الصح: ",el("span",{class:"en good"},ansText(a.q))),
        el("p",{},a.q.ex)))));
    $app.append(rv);
  }
  window.scrollTo({top:0});
}

async function boot(){
  if(!DATA){
    const p=new URLSearchParams(location.search); const s=p.get("s")||"";
    if(!/^[a-z0-9-]+$/.test(s)){ $app.innerHTML='<p class="loading">مفيش مادة بالاسم ده. <a href="./">ارجع للملخصات</a></p>'; return; }
    const v="?v="+(p.get("v")||"2");
    for(const base of [CDN,""]){ try{ const r=await fetch(base+"quizzes/"+s+".json"+v); if(r.ok){ DATA=await r.json(); break; } }catch(e){} }
    if(!DATA){ $app.innerHTML='<p class="loading">مقدرناش نحمّل الأسئلة، جرّب تاني بعد شوية. <a href="./">ارجع للملخصات</a></p>'; return; }
  }
  document.title="بنك أسئلة "+DATA.name+" | NURSING DOSE";
  home();
  const dl=new URLSearchParams(location.search).get("l");
  if(dl==="final") intro({key:"final",title:"Final Exam",sub:"امتحان شامل من كل المحاضرات",pool:DATA.qs,final:true});
  else if(dl){ const L=DATA.lecs.find(z=>String(z.n)===dl); if(L&&DATA.qs.some(q=>q.lec===L.n)) intro({key:"lec"+L.n,title:L.en,sub:L.ar,pool:DATA.qs.filter(q=>q.lec===L.n),final:false}); }
}
boot();
</script></body></html>
